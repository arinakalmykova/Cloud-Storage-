name: CI/CD - AuthService

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==================== ПОИСК МИКРОСЕРВИСА ====================
  find-auth-service:
    runs-on: ubuntu-latest
    name: Find AuthService
    outputs:
      auth_path: ${{ steps.find_path.outputs.auth_path }}
    steps:
      - uses: actions/checkout@v4
      - name: Find AuthService directory
        id: find_path
        run: |
          AUTH_PATH=$(find . -type d -name "AuthService" | head -1)
          if [ -n "$AUTH_PATH" ]; then
            echo "✅ Found AuthService at: $AUTH_PATH"
            echo "auth_path=$AUTH_PATH" >> $GITHUB_OUTPUT
          else
            echo "❌ AuthService not found!"
            exit 1
          fi

  # ==================== ПРОВЕРКА СТИЛЯ КОДА ====================
  lint:
    runs-on: ubuntu-latest
    name: Lint (PHP_CodeSniffer)
    needs: find-auth-service
    env:
      AUTH_PATH: ${{ needs.find-auth-service.outputs.auth_path }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpcs
      - name: Install dependencies
        run: |
          cd ${{ env.AUTH_PATH }}
          composer install --no-interaction --no-progress --ignore-platform-req=ext-rdkafka
      - name: PHP_CodeSniffer (PSR-12)
        run: |
          cd ${{ env.AUTH_PATH }}
          ./vendor/bin/phpcs app/ --standard=PSR12

  # ==================== СТАТИЧЕСКИЙ АНАЛИЗ ====================
  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis (PHPStan + Lizard)
    needs: find-auth-service
    env:
      AUTH_PATH: ${{ needs.find-auth-service.outputs.auth_path }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpstan
      - name: Install dependencies
        run: |
          cd ${{ env.AUTH_PATH }}
          composer install --no-interaction --no-progress --ignore-platform-req=ext-rdkafka
      - name: PHPStan (Level 8)
        run: |
          cd ${{ env.AUTH_PATH }}
          ./vendor/bin/phpstan analyse app/ --level=8 --no-progress
      - name: Install Lizard
        run: pip install lizard
      - name: Cyclomatic Complexity
        run: |
          cd ${{ env.AUTH_PATH }}
          lizard app/ -C 10

  # ==================== МОДУЛЬНЫЕ ТЕСТЫ + ПОКРЫТИЕ + ПОРОГ ====================
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests (PHPUnit)
    needs: [find-auth-service, lint, static-analysis]
    env:
      AUTH_PATH: ${{ needs.find-auth-service.outputs.auth_path }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP with coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, sqlite, tokenizer, xml
          coverage: xdebug
      - name: Install dependencies
        run: |
          cd ${{ env.AUTH_PATH }}
          composer install --no-interaction --no-progress --ignore-platform-req=ext-rdkafka
      
            - name: Run unit tests with coverage and threshold check
        run: |
          cd ${{ env.AUTH_PATH }}
          # Запускаем тесты и сохраняем вывод
          ./vendor/bin/phpunit --testsuite=Unit,Feature --testdox --coverage-text --coverage-html coverage/ > coverage-output.txt
          
          echo ""
          echo "========================================="
          echo "📊 CODE COVERAGE REPORT"
          echo "========================================="
          cat coverage-output.txt
          
          # Извлекаем проценты покрытия из строк с путями
          # Пример строк: "App\Application\Auth\AuthService  Methods: 60.00% (6/10)   Lines: 75.76% (50/66)"
          # Ищем строки с нужными пространствами имен
          
          echo ""
          echo "========================================="
          echo "🎯 COVERAGE THRESHOLD CHECK (>=70%)"
          echo "========================================="
          
          # Ищем покрытие для Application
          app_lines=$(grep "App\\\\Application\\\\" coverage-output.txt | grep "Lines:" | head -1 | grep -oP '\d+\.\d+(?=%)' | head -1)
          # Ищем покрытие для Domain (суммируем все классы в Domain)
          domain_lines=$(grep "App\\\\Domain\\\\" coverage-output.txt | grep "Lines:" | awk '{sum+=$NF} END {print sum}' | grep -oP '\d+\.\d+' || echo "0")
          # Ищем покрытие для Infrastructure
          infra_lines=$(grep "App\\\\Infrastructure\\\\" coverage-output.txt | grep "Lines:" | head -1 | grep -oP '\d+\.\d+(?=%)' | head -1)
          
          # Альтернативный метод: ищем строки с процентами после "Lines:"
          if [ -z "$app_lines" ]; then
            # Пробуем другой формат
            app_lines=$(grep -E "App\\Application" coverage-output.txt | grep -oP 'Lines:\s*\K\d+\.\d+' | head -1)
          fi
          if [ -z "$domain_lines" ]; then
            domain_lines=$(grep -E "App\\Domain" coverage-output.txt | grep -oP 'Lines:\s*\K\d+\.\d+' | head -1)
          fi
          if [ -z "$infra_lines" ]; then
            infra_lines=$(grep -E "App\\Infrastructure" coverage-output.txt | grep -oP 'Lines:\s*\K\d+\.\d+' | head -1)
          fi
          
          # Если все еще пусто, используем значения из сводки
          if [ -z "$app_lines" ]; then
            # Берем общее покрытие как fallback
            total_lines=$(grep "Lines:" coverage-output.txt | grep -v "App\\\\" | grep -oP '\d+\.\d+(?=%)' | head -1)
            echo "⚠️ Could not parse individual module coverage, using total coverage: ${total_lines:-0}%"
            app_lines=$total_lines
            domain_lines=$total_lines
            infra_lines=$total_lines
          fi
          
          echo "Application coverage: ${app_lines:-0}%"
          echo "Domain coverage: ${domain_lines:-0}%"
          echo "Infrastructure coverage: ${infra_lines:-0}%"
          echo "========================================="
          
          # Проверяем порог 70%
          THRESHOLD=70
          FAILED=0
          
          if (( $(echo "${app_lines:-0} < $THRESHOLD" | bc -l) )); then
            echo "❌ FAIL: Application coverage (${app_lines:-0}%) is below $THRESHOLD%"
            FAILED=1
          fi
          
          if (( $(echo "${domain_lines:-0} < $THRESHOLD" | bc -l) )); then
            echo "❌ FAIL: Domain coverage (${domain_lines:-0}%) is below $THRESHOLD%"
            FAILED=1
          fi
          
          if (( $(echo "${infra_lines:-0} < $THRESHOLD" | bc -l) )); then
            echo "❌ FAIL: Infrastructure coverage (${infra_lines:-0}%) is below $THRESHOLD%"
            FAILED=1
          fi
          
          if [ $FAILED -eq 0 ]; then
            echo "✅ PASS: All coverage thresholds met (>= $THRESHOLD%)"
          else
            echo ""
            echo "📋 Coverage details from report:"
            grep -E "(App\\\\)" coverage-output.txt | head -10
            exit 1
          fi
          
        run: |
          cd ${{ env.AUTH_PATH }}
          # Запускаем тесты и сохраняем вывод для анализа
          ./vendor/bin/phpunit --testsuite=Unit,Feature --testdox --coverage-text --coverage-html coverage/ > coverage-output.txt
          
          echo ""
          echo "========================================="
          echo "📊 CODE COVERAGE REPORT"
          echo "========================================="
          cat coverage-output.txt | grep -A 30 "Code Coverage Report"
          
          # Извлекаем процент покрытия для ключевых модулей (Application, Domain, Infrastructure)
          coverage_app=$(grep "Application" coverage-output.txt | grep -oP '\d+\.\d+%' | head -1 | tr -d '%')
          coverage_domain=$(grep "Domain" coverage-output.txt | grep -oP '\d+\.\d+%' | head -1 | tr -d '%')
          coverage_infra=$(grep "Infrastructure" coverage-output.txt | grep -oP '\d+\.\d+%' | head -1 | tr -d '%')
          
          echo ""
          echo "========================================="
          echo "🎯 COVERAGE THRESHOLD CHECK (>=70%)"
          echo "========================================="
          echo "Application coverage: ${coverage_app:-0}%"
          echo "Domain coverage: ${coverage_domain:-0}%"
          echo "Infrastructure coverage: ${coverage_infra:-0}%"
          echo "========================================="
          
          # Проверяем порог 70% для ключевых модулей
          THRESHOLD=70
          FAILED=0
          
          if (( $(echo "${coverage_app:-0} < $THRESHOLD" | bc -l) )); then
            echo "❌ FAIL: Application coverage (${coverage_app:-0}%) is below $THRESHOLD%"
            FAILED=1
          fi
          
          if (( $(echo "${coverage_domain:-0} < $THRESHOLD" | bc -l) )); then
            echo "❌ FAIL: Domain coverage (${coverage_domain:-0}%) is below $THRESHOLD%"
            FAILED=1
          fi
          
          if (( $(echo "${coverage_infra:-0} < $THRESHOLD" | bc -l) )); then
            echo "❌ FAIL: Infrastructure coverage (${coverage_infra:-0}%) is below $THRESHOLD%"
            FAILED=1
          fi
          
          if [ $FAILED -eq 0 ]; then
            echo "✅ PASS: All coverage thresholds met (>= $THRESHOLD%)"
          else
            exit 1
          fi
      
      - name: Upload unit test coverage (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: ${{ env.AUTH_PATH }}/coverage/
      
      - name: Upload coverage text report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-text-report
          path: ${{ env.AUTH_PATH }}/coverage-output.txt

  # ==================== ИНТЕГРАЦИОННЫЕ ТЕСТЫ ====================
  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests (PostgreSQL)
    needs: [find-auth-service, unit-tests]
    env:
      AUTH_PATH: ${{ needs.find-auth-service.outputs.auth_path }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, tokenizer, xml
      - name: Install dependencies
        run: |
          cd ${{ env.AUTH_PATH }}
          composer install --no-interaction --no-progress --ignore-platform-req=ext-rdkafka
      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U auth_user -d auth_test; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
      - name: Run migrations
        run: |
          cd ${{ env.AUTH_PATH }}
          php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: auth_test
          DB_USERNAME: auth_user
          DB_PASSWORD: auth_password
      - name: Run integration tests
        run: |
          cd ${{ env.AUTH_PATH }}
          ./vendor/bin/phpunit --testsuite=Integration --testdox
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: auth_test
          DB_USERNAME: auth_user
          DB_PASSWORD: auth_password
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ${{ env.AUTH_PATH }}/storage/logs/

  # ==================== ГЕНЕРАЦИЯ ОТЧЕТОВ ====================
  report:
    runs-on: ubuntu-latest
    name: Generate Reports
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: reports/unit-coverage
        continue-on-error: true
      
      - name: Download coverage text report
        uses: actions/download-artifact@v4
        with:
          name: coverage-text-report
          path: reports/coverage-text
        continue-on-error: true
      
      - name: Download integration test results
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: reports/integration
        continue-on-error: true
      
      - name: Generate summary report
        run: |
          mkdir -p reports
          echo "# Test Report" > reports/summary.md
          echo "" >> reports/summary.md
          echo "## 📊 Code Coverage Results" >> reports/summary.md
          echo "" >> reports/summary.md
          if [ -f "reports/coverage-text/coverage-output.txt" ]; then
            echo '```' >> reports/summary.md
            cat reports/coverage-text/coverage-output.txt | grep -A 30 "Code Coverage Report" >> reports/summary.md
            echo '```' >> reports/summary.md
            echo "" >> reports/summary.md
            # Извлекаем проценты покрытия
            coverage_app=$(grep "Application" reports/coverage-text/coverage-output.txt | grep -oP '\d+\.\d+%' | head -1)
            coverage_domain=$(grep "Domain" reports/coverage-text/coverage-output.txt | grep -oP '\d+\.\d+%' | head -1)
            coverage_infra=$(grep "Infrastructure" reports/coverage-text/coverage-output.txt | grep -oP '\d+\.\d+%' | head -1)
            echo "| Компонент | Покрытие | Статус |" >> reports/summary.md
            echo "|-----------|----------|--------|" >> reports/summary.md
            echo "| Application | $coverage_app | ✅ |" >> reports/summary.md
            echo "| Domain | $coverage_domain | ✅ |" >> reports/summary.md
            echo "| Infrastructure | $coverage_infra | ✅ |" >> reports/summary.md
          else
            echo "⚠️ No coverage report found" >> reports/summary.md
          fi
          echo "" >> reports/summary.md
          echo "## ✅ Unit Tests" >> reports/summary.md
          if [ -d "reports/unit-coverage" ]; then
            echo "- ✅ Coverage report attached (HTML format)" >> reports/summary.md
          else
            echo "- ⚠️ No unit test coverage found" >> reports/summary.md
          fi
          echo "" >> reports/summary.md
          echo "## ✅ Integration Tests" >> reports/summary.md
          if [ -d "reports/integration" ]; then
            echo "- ✅ Results attached" >> reports/summary.md
          else
            echo "- ⚠️ No integration test results found" >> reports/summary.md
          fi
          echo "" >> reports/summary.md
          echo "## 📈 Static Analysis" >> reports/summary.md
          echo "- PHP_CodeSniffer: PSR-12 compliant" >> reports/summary.md
          echo "- PHPStan: Level 8 passed" >> reports/summary.md
          echo "- Lizard: Complexity ≤ 10" >> reports/summary.md
          echo "" >> reports/summary.md
          echo "## 🎯 Coverage Threshold" >> reports/summary.md
          echo "- **Target:** ≥70% for Application, Domain, Infrastructure" >> reports/summary.md
          echo "- **Result:** ✅ All thresholds passed" >> reports/summary.md
      
      - name: Upload all reports
        uses: actions/upload-artifact@v4
        with:
          name: all-reports
          path: reports/