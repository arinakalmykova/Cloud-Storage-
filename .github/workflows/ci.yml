name: CI/CD - AuthService

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  find-auth-service:
    runs-on: ubuntu-latest
    name: Find AuthService
    outputs:
      auth_path: ${{ steps.find_path.outputs.auth_path }}
    steps:
      - uses: actions/checkout@v4
      - name: Find AuthService directory
        id: find_path
        run: |
          AUTH_PATH=$(find . -type d -name "AuthService" | head -1)
          if [ -n "$AUTH_PATH" ]; then
            echo "auth_path=$AUTH_PATH" >> $GITHUB_OUTPUT
          else
            echo "AuthService not found!"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    needs: find-auth-service
    env:
      AUTH_PATH: ${{ needs.find-auth-service.outputs.auth_path }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpcs
      - name: Install dependencies
        run: |
          cd $AUTH_PATH
          composer install --no-interaction --no-progress --ignore-platform-req=ext-rdkafka
      - name: Run PHPCS
        run: |
          cd $AUTH_PATH
          ./vendor/bin/phpcs app/ --standard=PSR12

  static-analysis:
    runs-on: ubuntu-latest
    needs: find-auth-service
    env:
      AUTH_PATH: ${{ needs.find-auth-service.outputs.auth_path }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpstan
      - name: Install dependencies
        run: |
          cd $AUTH_PATH
          composer install --no-interaction --no-progress --ignore-platform-req=ext-rdkafka
      - name: Run PHPStan
        run: |
          cd $AUTH_PATH
          ./vendor/bin/phpstan analyse app/ --level=8
      - name: Install Lizard
        run: pip install lizard
      - name: Run Lizard
        run: |
          cd $AUTH_PATH
          lizard app/ -C 10

  unit-tests:
    runs-on: ubuntu-latest
    needs: [find-auth-service, lint, static-analysis]
    env:
      AUTH_PATH: ${{ needs.find-auth-service.outputs.auth_path }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP with coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, sqlite, tokenizer, xml
          coverage: xdebug
      - name: Install dependencies
        run: |
          cd $AUTH_PATH
          composer install --no-interaction --no-progress --ignore-platform-req=ext-rdkafka
      - name: Run tests + coverage + threshold
        run: |
          cd $AUTH_PATH

          ./vendor/bin/phpunit \
            --testsuite=Unit,Feature \
            --coverage-text \
            --coverage-html coverage/ \
            > coverage-output.txt

          echo "==== COVERAGE ===="
          cat coverage-output.txt

          echo ""
          echo "========================================="
          echo "🎯 COVERAGE THRESHOLD CHECK (>=70%)"
          echo "========================================="

          # Извлекаем покрытие для AuthService (ищем "Lines: 75.76%")
          app_line=$(grep "App\\\\Application\\\\Auth\\\\AuthService" coverage-output.txt | head -1)
          app_coverage=$(echo "$app_line" | grep -oE 'Lines:\s*[0-9]+\.[0-9]+%' | grep -oE '[0-9]+\.[0-9]+')

          # Извлекаем покрытие для User entity
          user_line=$(grep "App\\\\Domain\\\\Auth\\\\Entities\\\\User" coverage-output.txt | head -1)
          user_coverage=$(echo "$user_line" | grep -oE 'Lines:\s*[0-9]+\.[0-9]+%' | grep -oE '[0-9]+\.[0-9]+')

          # Извлекаем покрытие для EloquentUserRepository
          repo_line=$(grep "EloquentUserRepository" coverage-output.txt | head -1)
          repo_coverage=$(echo "$repo_line" | grep -oE 'Lines:\s*[0-9]+\.[0-9]+%' | grep -oE '[0-9]+\.[0-9]+')

          echo "AuthService coverage: ${app_coverage:-0}%"
          echo "User entity coverage: ${user_coverage:-0}%"
          echo "EloquentUserRepository coverage: ${repo_coverage:-0}%"
          echo "========================================="

          THRESHOLD=70
          FAILED=0

          if [ -z "$app_coverage" ] || (( $(echo "$app_coverage < $THRESHOLD" | bc -l) )); then
            echo "❌ FAIL: AuthService coverage (${app_coverage:-0}%) is below $THRESHOLD%"
            FAILED=1
          fi

          if [ -z "$user_coverage" ] || (( $(echo "$user_coverage < $THRESHOLD" | bc -l) )); then
            echo "❌ FAIL: User entity coverage (${user_coverage:-0}%) is below $THRESHOLD%"
            FAILED=1
          fi

          if [ -z "$repo_coverage" ] || (( $(echo "$repo_coverage < $THRESHOLD" | bc -l) )); then
            echo "❌ FAIL: EloquentUserRepository coverage (${repo_coverage:-0}%) is below $THRESHOLD%"
            FAILED=1
          fi

          if [ $FAILED -eq 0 ]; then
            echo "✅ PASS: All key modules coverage >= $THRESHOLD%"
          else
            echo ""
            echo "Debug info:"
            echo "AuthService line: $app_line"
            echo "User line: $user_line"
            echo "Repository line: $repo_line"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ env.AUTH_PATH }}/coverage/

      - name: Upload coverage text
        uses: actions/upload-artifact@v4
        with:
          name: coverage-text
          path: ${{ env.AUTH_PATH }}/coverage-output.txt

  integration-tests:
    runs-on: ubuntu-latest
    needs: [find-auth-service, unit-tests]
    env:
      AUTH_PATH: ${{ needs.find-auth-service.outputs.auth_path }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_password
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pgsql
      - name: Install dependencies
        run: |
          cd $AUTH_PATH
          composer install --no-interaction --no-progress --ignore-platform-req=ext-rdkafka
      - name: Wait for Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432; do sleep 2; done
      - name: Run migrations
        run: |
          cd $AUTH_PATH
          php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: auth_test
          DB_USERNAME: auth_user
          DB_PASSWORD: auth_password
      - name: Run integration tests
        run: |
          cd $AUTH_PATH
          ./vendor/bin/phpunit --testsuite=Integration
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: auth_test
          DB_USERNAME: auth_user
          DB_PASSWORD: auth_password

  report:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-text
          path: reports
        continue-on-error: true
      - name: Generate report
        run: |
          mkdir -p reports
          echo "# CI Report" > reports/summary.md
          if [ -f "reports/coverage-output.txt" ]; then
            echo "## Coverage" >> reports/summary.md
            echo '```' >> reports/summary.md
            cat reports/coverage-output.txt >> reports/summary.md
            echo '```' >> reports/summary.md
          fi
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: reports/