name: CI/CD - AuthService

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-analysis:
    runs-on: ubuntu-latest
    name: PHP Static Analysis
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Find AuthService path
        id: find_path
        run: |
          # Ищем AuthService в репозитории
          AUTH_PATH=$(find . -type d -name "AuthService" | head -1)
          if [ -n "$AUTH_PATH" ]; then
            echo "Found AuthService at: $AUTH_PATH"
            echo "path=$AUTH_PATH" >> $GITHUB_OUTPUT
          else
            echo "AuthService not found!"
            exit 1
          fi
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      
      - name: Install dependencies
        run: |
          cd ${{ steps.find_path.outputs.path }}
          composer install --no-interaction --no-progress || true
      
      - name: PHP_CodeSniffer (PSR-12)
        run: |
          cd ${{ steps.find_path.outputs.path }}
          ./vendor/bin/phpcs app/ --standard=PSR12 || true
      
      - name: PHPStan
        run: |
          cd ${{ steps.find_path.outputs.path }}
          ./vendor/bin/phpstan analyse app/ --level=8 --no-progress || true
      
      - name: Install Lizard
        run: pip install lizard
      
      - name: Cyclomatic Complexity
        run: |
          cd ${{ steps.find_path.outputs.path }}
          lizard app/ -C 10 || true

  php-tests:
    runs-on: ubuntu-latest
    name: PHP Unit Tests
    needs: php-analysis
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Find AuthService path
        id: find_path
        run: |
          AUTH_PATH=$(find . -type d -name "AuthService" | head -1)
          echo "path=$AUTH_PATH" >> $GITHUB_OUTPUT
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      
      - name: Install dependencies
        run: |
          cd ${{ steps.find_path.outputs.path }}
          composer install --no-interaction --no-progress || true
      
      - name: Run tests
        run: |
          cd ${{ steps.find_path.outputs.path }}
          ./vendor/bin/phpunit --testdox || echo "No tests found"
