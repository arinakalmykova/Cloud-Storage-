name: CI/CD Pipeline - AuthService

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/AuthService/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend/AuthService/**'

jobs:
  # Статический анализ PHP кода
  php-analysis:
    runs-on: ubuntu-latest
    name: PHP Static Analysis (CodeSniffer + PHPStan)
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer, phpcs, phpstan
    
    - name: Install Dependencies
      run: |
        cd backend/AuthService
        composer install --no-progress --no-interaction
    
    - name: PHP_CodeSniffer (PSR-12)
      run: |
        cd backend/AuthService
        ./vendor/bin/phpcs app/ --standard=PSR12
    
    - name: PHPStan (Level 8)
      run: |
        cd backend/AuthService
        ./vendor/bin/phpstan analyse app/ --level=8 --no-progress
    
    - name: Install Lizard for complexity analysis
      run: pip install lizard
    
    - name: Lizard (Cyclomatic Complexity)
      run: |
        cd backend/AuthService
        lizard app/ -C 10

  # Модульные тесты
  php-tests:
    runs-on: ubuntu-latest
    name: PHP Unit Tests
    needs: php-analysis
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: xdebug
    
    - name: Install Dependencies
      run: |
        cd backend/AuthService
        composer install --no-progress --no-interaction
    
    - name: Copy .env
      run: |
        cd backend/AuthService
        php -r "file_exists('.env') || copy('.env.example', '.env');" || true
    
    - name: Generate key
      run: |
        cd backend/AuthService
        php artisan key:generate || true
    
    - name: Create Database
      run: |
        cd backend/AuthService
        mkdir -p database
        touch database/database.sqlite || true
    
    - name: Run tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: backend/AuthService/database/database.sqlite
      run: |
        cd backend/AuthService
        ./vendor/bin/phpunit --testdox
