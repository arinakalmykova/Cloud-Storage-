version: '3.8'

services:
  # ============================================================
  # KAFKA & ZOOKEEPER
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - appnet

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"  # Основной порт для приложений
      - "29092:29092"  # Дополнительный
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - appnet

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - appnet

  # ============================================================
  # DATABASES
  # ============================================================
  postgres_auth:
    image: postgres:16
    container_name: pg-auth
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: pass1
    ports:
      - "5433:5432"
    networks:
      - appnet
    volumes:
      - pg_auth_data:/var/lib/postgresql/data

  postgres_photo:
    image: postgres:16
    container_name: pg-photo
    environment:
      POSTGRES_DB: photo
      POSTGRES_USER: user2
      POSTGRES_PASSWORD: pass2
    ports:
      - "5434:5432"
    networks:
      - appnet
    volumes:
      - pg_photo_data:/var/lib/postgresql/data

  postgres_compress:
    image: postgres:16
    container_name: pg-compress
    environment:
      POSTGRES_DB: compress
      POSTGRES_USER: user3
      POSTGRES_PASSWORD: pass3
    ports:
      - "5435:5432"
    networks:
      - appnet
    volumes:
      - pg_compress_data:/var/lib/postgresql/data

  # ============================================================
  # MINIO (S3 совместимое хранилище)
  # ============================================================
  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - appnet

  # ============================================================
  # AUTH SERVICE
  # ============================================================
  authservice:
    build: ./backend/AuthService
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - ./backend/AuthService/.env
    depends_on:
      - postgres_auth
      - kafka
    networks:
      - appnet
    volumes:
      - ./backend/AuthService:/var/www
      - ./backend/AuthService/storage:/var/www/storage
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=80


  # ============================================================
  # PHOTO SERVICE
  # ============================================================
  photoservice:
    build: ./backend/PhotoService
    container_name: photo-service
    restart: unless-stopped
    env_file:
      - ./backend/PhotoService/.env
    depends_on:
      - postgres_photo
      - kafka
      - minio
    networks:
      - appnet
    volumes:
      - ./backend/PhotoService:/var/www
      - ./backend/PhotoService/storage:/var/www/storage
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=80

  photo-service-worker-user-created:
    build: ./backend/PhotoService
    container_name: photo-service-worker-user
    restart: unless-stopped
    env_file:
      - ./backend/PhotoService/.env
    depends_on:
      - postgres_photo
      - kafka
      - minio
    networks:
      - appnet
    volumes:
      - ./backend/PhotoService:/var/www
    working_dir: /var/www
    command: php artisan kafka:consume-user-created --topic=auth_events --group=user-created-group-1

  photo-service-worker-photo-compressed:
    build: ./backend/PhotoService
    container_name: photo-service-worker-compressed
    restart: unless-stopped
    env_file:
      - ./backend/PhotoService/.env
    depends_on:
      - postgres_photo
      - kafka
      - minio
    networks:
      - appnet
    volumes:
      - ./backend/PhotoService:/var/www
    working_dir: /var/www
    command: php artisan kafka:consume-photo-compressed --topic=photo_events --group=photo-events-group-1
    
  # ============================================================
  # COMPRESSION SERVICE
  # ============================================================
  compressionservice:
    build: ./backend/CompressionService
    container_name: compression-service
    restart: unless-stopped
    env_file:
      - ./backend/CompressionService/.env
    depends_on:
      - kafka
      - postgres_compress
    networks:
      - appnet
    volumes:
      - ./backend/CompressionService:/var/www
      - ./backend/CompressionService/storage:/var/www/storage
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=80


  compressionservice-worker:
    build: ./backend/CompressionService
    container_name: compression-service-worker
    restart: unless-stopped
    env_file:
      - ./backend/CompressionService/.env
    depends_on:
      - kafka
      - postgres_compress
    networks:
      - appnet
    volumes:
      - ./backend/CompressionService:/var/www
    working_dir: /var/www
    command: php artisan kafka:consume-photo-compression --topic=compression_events --group=photo-compression-group-1

  # ============================================================
  # ML SERVICE (Python)
  # ============================================================
  mlservice:
    build: ./backend/MLService
    container_name: ml-service
    restart: unless-stopped
    networks:
      - appnet
    ports:
      - "5000:5000"
    depends_on:
      - kafka

  # ============================================================
  # NGINX
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - appnet
    depends_on:
      - authservice
      - photoservice
      - compressionservice

  # ============================================================
  # FRONTEND
  # ============================================================
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    networks:
      - appnet
    ports:
      - "3000:3000"
    depends_on:
      - authservice
      - photoservice

networks:
  appnet:
    driver: bridge

volumes:
  pg_auth_data:
  pg_photo_data:
  pg_compress_data:
  minio_data:
  kafka_data: